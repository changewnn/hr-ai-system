[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*", "scripts*", "tests*"]

[project]
name = "hr-ai-system-backend"
version = "0.1.0"
description = "FastAPI backend for the minimal HR system"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "asyncpg>=0.30,<1.0",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "cryptography>=44.0,<45.0",
    "bcrypt>=4.2,<5.0",
    "openpyxl>=3.1,<4.0",
    "email-validator>=2.2,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]
dev = [
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["tests"]
